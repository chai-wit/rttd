<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผังโต๊ะจีน คืนสู่เหย้าชาวเทา-แดง ประจำปี 2569</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-2 md:p-6">

    <div class="max-w-[1600px] mx-auto bg-white rounded-xl shadow-lg p-4 md:p-6 border border-gray-200 overflow-x-auto">
        
        <!-- Header Title -->
        <div class="text-center mb-4">
            <h1 class="text-xl md:text-2xl font-bold text-gray-900">ผังโต๊ะจีน</h1>
            <h2 class="text-base md:text-lg font-semibold text-gray-800">งานราตรี "คืนสู่เหย้าชาวเทา-แดง" ประจำปี 2569</h2>
            <p class="text-sm text-gray-600">ณ ร.ร.ชัยบาดาลวิทยา อำเภอชัยบาดาล จังหวัดลพบุรี</p>
        </div>

        <!-- Layout Container -->
        <div class="min-w-[1200px]">
            
            <!-- Stage Bar (เวทีดนตรี-การแสดง) -->
            <div class="grid grid-cols-[30px_repeat(16,1fr)] gap-1 mb-4">
                <div class="col-start-5 col-span-9 bg-sky-200 border-2 border-sky-600 text-sky-950 font-bold text-center py-1.5 rounded shadow-sm text-sm">
                    เวทีดนตรี-การแสดง
                </div>
            </div>

            <!-- Column Numbers (1 to 15) -->
            <div class="grid grid-cols-[30px_repeat(16,1fr)] gap-1 mb-1 text-center font-bold text-gray-700 text-xs md:text-sm">
                <div></div> <!-- Empty for row header -->
                <div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div>7</div><div>8</div><div>9</div><div>10</div><div>11</div><div>12</div><div>13</div><div>14</div><div>15</div><div></div>
            </div>

            <!-- Table Grid 10 Rows x 16 Columns -->
            <div id="table-grid" class="grid grid-cols-[30px_repeat(16,1fr)] gap-1">
                <!-- JavaScript จะเรนเดอร์ผังโต๊ะตรงนี้ -->
            </div>
        </div>
    </div>

    <!-- Table Details Modal -->
    <div id="table-modal" class="fixed inset-0 bg-black/50 hidden backdrop-blur-sm flex justify-center items-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-sm w-full p-5 shadow-2xl relative border border-gray-200">
            <button onclick="closeModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
            <h3 id="modal-title" class="text-lg font-bold text-gray-800 border-b pb-2 mb-3">ข้อมูลโต๊ะ</h3>
            <div id="modal-body" class="space-y-2 text-xs text-gray-600">
                <!-- ข้อมูลรายละเอียดจะแสดงที่นี่ -->
            </div>
        </div>
    </div>

    <script>
        // 🔗 วาง Web App URL ที่ได้จาก Google Apps Script ที่นี่
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbx3u14yUmM4FryW8xB3FcDTion4vX6DZCJXRhHs30SxTaJ0myac1U0wWaV6XcrTfcYOOw/exec";

        // กำหนดรายการโต๊ะสีพิเศษตามภาพต้นฉบับ
        const blueTables = [13, 14, 15, 16, 30, 31, 45, 46, 60, 61, 76, 91, 106, 121, 122, 123, 137, 138];
        const greenTables = [8, 23, 38, 53, 68, 83];
        const redTables = [136];

        // ข้อความกำกับพิเศษประจำโต๊ะตามภาพ
        const specialLabels = {
            8: "8<br><span class='text-[9px]'>VIP-1</span>",
            23: "23<br><span class='text-[9px]'>VIP-2</span>",
            38: "38<br><span class='text-[9px]'>VIP-3</span>",
            53: "53<br><span class='text-[9px]'>VIP-4</span>",
            68: "68<br><span class='text-[9px]'>ครูบำนาญ</span>",
            83: "83<br><span class='text-[9px]'>ครูบำนาญ</span>",
            136: "136<br><span class='text-[9px]'>อปพร</span>"
        };

        // 🛡️ Security Helper (XSS Protection)
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        async function fetchTableData() {
            try {
                const response = await fetch(GAS_API_URL);
                const json = await response.json();
                if (json.status === "success") {
                    renderGrid(json.data);
                }
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        function renderGrid(tableDataList) {
            const grid = document.getElementById('table-grid');
            grid.innerHTML = '';

            // สร้าง Map ข้อมูลโต๊ะ
            const dataMap = {};
            tableDataList.forEach(item => {
                dataMap[item.Table_No] = item;
            });

            // สร้างแถวที่ 1 ถึง 10
            for (let r = 1; r <= 10; r++) {
                
                // เลขแถวฝั่งซ้าย
                const rowLabel = document.createElement('div');
                rowLabel.className = "flex items-center justify-center font-bold text-gray-700 text-sm";
                rowLabel.innerText = r;
                grid.appendChild(rowLabel);

                // กำหนดหมายเลขโต๊ะประจำแถว 1-10
                for (let c = 1; c <= 16; c++) {
                    let tNum = null;

                    if (r <= 6) {
                        // แถว 1-6 มี 15 โต๊ะ
                        if (c <= 15) tNum = (r - 1) * 15 + c;
                    } else {
                        // แถว 7-10 เว้นช่องทางเดินที่ Column 8
                        if (c <= 7) {
                            tNum = 90 + (r - 7) * 15 + c;
                        } else if (c === 8) {
                            tNum = null; // ช่องทางเดิน (Walkway)
                        } else if (c <= 16) {
                            tNum = 90 + (r - 7) * 15 + (c - 1);
                        }
                    }

                    // เรนเดอร์ช่องว่างทางเดินหรือช่องท้ายแถว
                    if (tNum === null || tNum > 150) {
                        const emptyCell = document.createElement('div');
                        emptyCell.className = c === 8 && r >= 7 ? "bg-gray-50 border border-dashed border-gray-200 rounded" : "";
                        grid.appendChild(emptyCell);
                        continue;
                    }

                    const itemData = dataMap[tNum] || { Table_No: tNum };
                    
                    // กำหนดโทนสีการ์ดตามภาพต้นฉบับ
                    let headerColor = "bg-[#7a3b11] text-white"; // สีน้ำตาลมาตรฐาน
                    if (greenTables.includes(tNum)) headerColor = "bg-[#2d6a30] text-white"; // VIP / ครูบำนาญ
                    else if (blueTables.includes(tNum)) headerColor = "bg-[#1d3557] text-white"; // ครู ชบ.
                    else if (redTables.includes(tNum)) headerColor = "bg-[#9b111e] text-white"; // อปพร

                    const card = document.createElement('div');
                    card.className = "bg-[#fdf8e7] border border-amber-800/40 rounded flex flex-col justify-between overflow-hidden shadow-sm cursor-pointer hover:border-amber-900 transition-all aspect-[4/3] min-h-[36px]";
                    card.onclick = () => openModal(itemData);

                    // ข้อความส่วนหัว
                    const headerText = specialLabels[tNum] || tNum;
                    const safeName = escapeHtml(itemData.Customer_Name || itemData.Note || '');

                    card.innerHTML = `
                        <div class="${headerColor} text-center font-bold text-xs py-0.5 leading-tight border-b border-black/10">
                            ${headerText}
                        </div>
                        <div class="p-0.5 text-center flex-1 flex items-center justify-center">
                            <span class="text-[9px] leading-tight text-gray-800 font-medium line-clamp-2">
                                ${safeName}
                            </span>
                        </div>
                    `;

                    grid.appendChild(card);
                }
            }
        }

        function openModal(table) {
            const safeTableNo = escapeHtml(table.Table_No);
            const safeZone = escapeHtml(table.Zone || '-');
            const safeStatus = escapeHtml(table.Status || 'Available');
            const safeCustomer = escapeHtml(table.Customer_Name || '-');
            const safeSeats = escapeHtml(table.Seats || '10');
            const safeNote = escapeHtml(table.Note || '-');

            document.getElementById('modal-title').innerText = `รายละเอียด โต๊ะหมายเลข ${safeTableNo}`;
            const body = document.getElementById('modal-body');
            
            body.innerHTML = `
                <div class="flex justify-between border-b pb-1">
                    <span class="font-semibold">สถานะ:</span>
                    <span class="font-bold text-amber-800">${safeStatus}</span>
                </div>
                <div class="flex justify-between border-b pb-1">
                    <span class="font-semibold">ชื่อผู้จอง / หมายเหตุ:</span>
                    <span>${safeCustomer}</span>
                </div>
                <div class="flex justify-between border-b pb-1">
                    <span class="font-semibold">โซน:</span>
                    <span>${safeZone}</span>
                </div>
                <div class="flex justify-between border-b pb-1">
                    <span class="font-semibold">จำนวนที่นั่ง:</span>
                    <span>${safeSeats} ที่นั่ง</span>
                </div>
                <div class="flex justify-between border-b pb-1">
                    <span class="font-semibold">รายละเอียดเพิ่มเติม:</span>
                    <span>${safeNote}</span>
                </div>
            `;
            document.getElementById('table-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('table-modal').classList.add('hidden');
        }

        fetchTableData();
        setInterval(fetchTableData, 5000);
    </script>
</body>
</html>
