<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบผังโต๊ะจีน Real-time (100 โต๊ะ)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- Header & Stats Summary -->
        <header class="bg-white rounded-xl shadow-md p-6 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-gray-800">แผนผังสถานะการจองโต๊ะจีน</h1>
                <p class="text-sm text-gray-500 mt-1">อัปเดตข้อมูล Real-time จาก Google Sheet</p>
            </div>
            
            <!-- Summary Badges -->
            <div class="flex flex-wrap gap-3 text-sm font-semibold">
                <div class="bg-emerald-100 text-emerald-800 px-3 py-1.5 rounded-lg flex items-center gap-2">
                    <span class="w-3 h-3 bg-emerald-500 rounded-full"></span>
                    ว่าง: <span id="count-available">0</span>
                </div>
                <div class="bg-amber-100 text-amber-800 px-3 py-1.5 rounded-lg flex items-center gap-2">
                    <span class="w-3 h-3 bg-amber-500 rounded-full"></span>
                    รอยืนยัน: <span id="count-pending">0</span>
                </div>
                <div class="bg-rose-100 text-rose-800 px-3 py-1.5 rounded-lg flex items-center gap-2">
                    <span class="w-3 h-3 bg-rose-500 rounded-full"></span>
                    จองแล้ว: <span id="count-reserved">0</span>
                </div>
                <div class="bg-sky-100 text-sky-800 px-3 py-1.5 rounded-lg flex items-center gap-2">
                    <span class="w-3 h-3 bg-sky-500 rounded-full"></span>
                    นั่งแล้ว: <span id="count-occupied">0</span>
                </div>
            </div>
        </header>

        <!-- Table Grid Container (100 Tables) -->
        <main class="bg-white rounded-xl shadow-md p-6">
            <div id="table-grid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-10 gap-3">
                <!-- Javascript จะเรนเดอร์โต๊ะ 100 ตัวตรงนี้ -->
            </div>
        </main>
    </div>

    <!-- Table Details Modal -->
    <div id="table-modal" class="fixed inset-0 bg-black/50 hidden backdrop-blur-sm flex justify-center items-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl relative animate-fade-in">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
            <h3 id="modal-title" class="text-xl font-bold text-gray-800 border-b pb-2 mb-4">ข้อมูลโต๊ะ</h3>
            <div id="modal-body" class="space-y-3 text-sm text-gray-600">
                <!-- ข้อมูลรายละเอียดจะถูกใส่ที่นี่ -->
            </div>
        </div>
    </div>

    <script>
        // 🔗 วาง Web App URL ที่ได้จาก Google Apps Script ที่นี่
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbx3u14yUmM4FryW8xB3FcDTion4vX6DZCJXRhHs30SxTaJ0myac1U0wWaV6XcrTfcYOOw/exec";
        

        const statusColors = {
            'Available': 'bg-emerald-500 hover:bg-emerald-600 text-white border-emerald-600',
            'Pending': 'bg-amber-400 hover:bg-amber-500 text-white border-amber-500',
            'Reserved': 'bg-rose-500 hover:bg-rose-600 text-white border-rose-600',
            'Occupied': 'bg-sky-500 hover:bg-sky-600 text-white border-sky-600'
        };

        const statusTextTH = {
            'Available': 'ว่าง',
            'Pending': 'รอยืนยัน',
            'Reserved': 'จองแล้ว',
            'Occupied': 'นั่งแล้ว'
        };

        let currentData = [];

        async function fetchTableData() {
            try {
                const response = await fetch(GAS_API_URL);
                const json = await response.json();
                if (json.status === "success") {
                    currentData = json.data;
                    renderTables(json.data);
                    updateSummaryStats(json.data);
                }
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        function renderTables(tables) {
            const grid = document.getElementById('table-grid');
            grid.innerHTML = '';

            tables.forEach(table => {
                const colorClass = statusColors[table.Status] || 'bg-gray-300 text-gray-700';
                
                const card = document.createElement('div');
                card.className = `${colorClass} border-b-4 rounded-xl p-3 flex flex-col justify-between items-center cursor-pointer transition-all duration-200 transform hover:-translate-y-1 shadow-sm aspect-square`;
                card.onclick = () => openModal(table);

                card.innerHTML = `
                    <span class="text-xs font-semibold opacity-80">${table.Zone || 'General'}</span>
                    <span class="text-xl font-bold">โต๊ะ ${table.Table_No}</span>
                    <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded bg-black/10">
                        ${statusTextTH[table.Status] || table.Status}
                    </span>
                `;
                grid.appendChild(card);
            });
        }

        function updateSummaryStats(tables) {
            const counts = { Available: 0, Pending: 0, Reserved: 0, Occupied: 0 };
            tables.forEach(t => { if(counts[t.Status] !== undefined) counts[t.Status]++; });

            document.getElementById('count-available').innerText = counts.Available;
            document.getElementById('count-pending').innerText = counts.Pending;
            document.getElementById('count-reserved').innerText = counts.Reserved;
            document.getElementById('count-occupied').innerText = counts.Occupied;
        }

        function openModal(table) {
            document.getElementById('modal-title').innerText = `รายละเอียด โต๊ะหมายเลข ${table.Table_No} (${table.Zone})`;
            const body = document.getElementById('modal-body');
            
            body.innerHTML = `
                <div class="flex justify-between border-b pb-1">
                    <span class="font-semibold">สถานะ:</span>
                    <span class="font-bold">${statusTextTH[table.Status] || table.Status}</span>
                </div>
                <div class="flex justify-between border-b pb-1">
                    <span class="font-semibold">ชื่อผู้จอง:</span>
                    <span>${table.Customer_Name || '-'}</span>
                </div>
                <div class="flex justify-between border-b pb-1">
                    <span class="font-semibold">เบอร์โทรศัพท์:</span>
                    <span>${table.Phone || '-'}</span>
                </div>
                <div class="flex justify-between border-b pb-1">
                    <span class="font-semibold">จำนวนที่นั่ง:</span>
                    <span>${table.Seats || '10'} ที่นั่ง</span>
                </div>
                <div class="flex justify-between border-b pb-1">
                    <span class="font-semibold">หมายเหตุ:</span>
                    <span>${table.Note || '-'}</span>
                </div>
                <div class="flex justify-between text-xs text-gray-400 pt-2">
                    <span>อัปเดตล่าสุด:</span>
                    <span>${table.Updated_At || '-'}</span>
                </div>
            `;
            document.getElementById('table-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('table-modal').classList.add('hidden');
        }

        // เริ่มดึงข้อมูลครั้งแรก
        fetchTableData();

        // Polling ดึงข้อมูลใหม่ทุกๆ 3 วินาที ( Real-time Simulation )
        setInterval(fetchTableData, 3000);
    </script>
</body>
</html>
