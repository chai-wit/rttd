<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผังโต๊ะจีน คืนสู่เหย้าชาวเทา-แดง ประจำปี 2569</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
        .custom-zone-grid {
            display: grid;
            grid-template-columns: 28px repeat(8, minmax(0, 1fr));
            gap: 4px;
        }
        @media (min-width: 768px) {
            .custom-zone-grid {
                grid-template-columns: 34px repeat(8, minmax(0, 1fr));
                gap: 6px;
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-2 md:p-6">

    <!-- Main Container Card -->
    <div class="max-w-[1700px] mx-auto bg-white rounded-xl shadow-lg p-3 md:p-6 border border-gray-200">
        
        <!-- Header Title & Logo -->
        <div class="text-center mb-4 w-full max-w-4xl mx-auto px-2">
            <img src="https://www.chaiwit.ac.th/web/wp-content/uploads/2022/06/chaiwitlogo.png" 
                 alt="โลโก้โรงเรียนชัยบาดาลวิทยา" 
                 class="h-20 md:h-24 mx-auto mb-3 object-contain drop-shadow-sm">
            <h1 class="text-xl md:text-2xl font-bold text-gray-900">ผังโต๊ะจีน</h1>
            <h2 class="text-base md:text-lg font-semibold text-gray-800">งานราตรี "คืนสู่เหย้าชาวเทา-แดง" ประจำปี 2569</h2>
            <p class="text-sm text-gray-600">ณ ร.ร.ชัยบาดาลวิทยา อำเภอชัยบาดาล จังหวัดลพบุรี</p>
        </div>

        <!-- 📊 Dashboard สรุปจำนวนโต๊ะ -->
        <div class="grid grid-cols-3 gap-2 md:gap-4 max-w-xl mx-auto mb-6 text-center">
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-2 md:p-3 shadow-sm">
                <div class="text-xs md:text-sm font-semibold text-slate-500">โต๊ะทั้งหมด</div>
                <div id="stat-total" class="text-lg md:text-2xl font-bold text-slate-800">150</div>
            </div>
            <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-2 md:p-3 shadow-sm">
                <div class="text-xs md:text-sm font-semibold text-emerald-700">จองแล้ว</div>
                <div id="stat-booked" class="text-lg md:text-2xl font-bold text-emerald-600">0</div>
            </div>
            <div class="bg-amber-50 border border-amber-200 rounded-xl p-2 md:p-3 shadow-sm">
                <div class="text-xs md:text-sm font-semibold text-amber-700">ยังว่าง</div>
                <div id="stat-available" class="text-lg md:text-2xl font-bold text-amber-600">150</div>
            </div>
        </div>

        <!-- Layout Container -->
        <div class="flex flex-col lg:flex-row gap-6 lg:gap-8 justify-center items-start w-full">
            
            <!-- ⬅️ โซนฝั่งซ้าย (คอลัมน์ 1 - 8) -->
            <div class="w-full lg:w-1/2 max-w-[750px] mx-auto">
                <div class="custom-zone-grid mb-2">
                    <div style="grid-column: 2 / span 8;" class="bg-sky-200 border-2 border-sky-600 text-sky-950 font-bold text-center py-1.5 md:py-2 rounded shadow-sm text-xs md:text-sm">
                        เวทีดนตรี-การแสดง (ฝั่งซ้าย)
                    </div>
                </div>

                <div class="custom-zone-grid mb-1 text-center font-bold text-gray-700 text-xs md:text-sm">
                    <div></div>
                    <div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div>7</div><div>8</div>
                </div>

                <div id="grid-left" class="custom-zone-grid"></div>
            </div>

            <!-- ➡️ โซนฝั่งขวา (คอลัมน์ 9 - 15) -->
            <div class="w-full lg:w-1/2 max-w-[750px] mx-auto">
                <div class="custom-zone-grid mb-2">
                    <div style="grid-column: 2 / span 8;" class="bg-sky-200 border-2 border-sky-600 text-sky-950 font-bold text-center py-1.5 md:py-2 rounded shadow-sm text-xs md:text-sm">
                        เวทีดนตรี-การแสดง (ฝั่งขวา)
                    </div>
                </div>

                <div class="custom-zone-grid mb-1 text-center font-bold text-gray-700 text-xs md:text-sm">
                    <div></div>
                    <div>9</div><div>10</div><div>11</div><div>12</div><div>13</div><div>14</div><div>15</div><div></div>
                </div>

                <div id="grid-right" class="custom-zone-grid"></div>
            </div>

        </div>
    </div>

    <!-- 🖱️ Tooltip -->
    <div id="table-tooltip" class="fixed hidden pointer-events-none bg-gray-900/95 text-white text-xs rounded-lg p-3 shadow-xl z-50 border border-gray-700 min-w-[180px] backdrop-blur-sm transition-opacity duration-150">
        <div id="tooltip-title" class="font-bold border-b border-gray-700 pb-1.5 mb-1.5 text-amber-300 text-sm"></div>
        <div id="tooltip-body" class="space-y-1"></div>
    </div>

    <!-- Table Details Modal -->
    <div id="table-modal" class="fixed inset-0 bg-black/50 hidden backdrop-blur-sm flex justify-center items-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-sm w-full p-5 shadow-2xl relative border border-gray-200">
            <button onclick="closeModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
            <h3 id="modal-title" class="text-lg font-bold text-gray-800 border-b pb-2 mb-3">ข้อมูลโต๊ะ</h3>
            <div id="modal-body" class="space-y-2 text-sm text-gray-600"></div>
        </div>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxJMVFMTdzsTQWn1HQqpuruvYnxa1FGkevkiKurSano73NtitUY2UxFqIVfoytfMHkncw/exec";

        const blueTables = [13, 14, 15, 16, 30, 31, 45, 46, 60, 61, 76, 91, 106, 121, 122, 123, 137, 138];
        const greenTables = [8, 23, 38, 53, 68, 83];

        const specialLabels = {
            8: "VIP-1",
            23: "VIP-2",
            38: "VIP-3",
            53: "VIP-4",
            68: "ครูบำนาญ",
            83: "ครูบำนาญ"
        };

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function createCard(container, tNum, dataMap) {
            if (tNum === null || tNum > 150) {
                const emptyCell = document.createElement('div');
                container.appendChild(emptyCell);
                return;
            }

            const itemData = dataMap[tNum] || { Table_No: tNum };
            const customerName = (itemData.Customer_Name || itemData.Note || '').trim();
            const specialTag = specialLabels[tNum] || '';

            const displayBodyText = customerName || specialTag;

            let headerStyle = "background-color: #7a3b11; color: #ffffff;";
            let bodyStyle = "background-color: #fdf8e7; color: #1f2937;";

            if (tNum === 136 || tNum === 12) {
                headerStyle = "background-color: #660000; color: #ffffff;";
                bodyStyle = "background-color: #D2691E; color: #ffffff;";
            } else if (customerName.includes("ครู ชบ") || blueTables.includes(tNum)) {
                headerStyle = "background-color: #1C4587; color: #ffffff;";
                bodyStyle = "background-color: #CFE2F3; color: #000000;";
            } else if (greenTables.includes(tNum)) {
                headerStyle = "background-color: #1b4d24; color: #ffffff;";
                bodyStyle = "background-color: #286332; color: #ffffff;";
            }

            const card = document.createElement('div');
            card.className = "border border-amber-800/30 rounded flex flex-col justify-between overflow-hidden shadow-sm cursor-pointer hover:border-amber-900 hover:shadow-md active:scale-95 transition-all min-h-[48px] md:min-h-[54px]";
            
            card.onmouseenter = (e) => showTooltip(e, itemData);
            card.onmousemove = (e) => updateTooltipPosition(e);
            card.onmouseleave = () => hideTooltip();
            card.onclick = () => openModal(itemData);

            const safeBodyText = escapeHtml(displayBodyText);

            card.innerHTML = `
                <div style="${headerStyle}" class="text-center font-bold text-[12px] md:text-[14px] py-0.5 leading-tight border-b border-black/10">
                    ${tNum}
                </div>
                <div style="${bodyStyle}" class="px-0.5 py-1 text-center flex-1 flex items-center justify-center overflow-hidden">
                    <span class="text-[10px] md:text-[12px] leading-snug font-semibold break-words w-full">
                        ${safeBodyText}
                    </span>
                </div>
            `;

            container.appendChild(card);
        }

        function renderGrids(tableDataList = []) {
            const leftGrid = document.getElementById('grid-left');
            const rightGrid = document.getElementById('grid-right');
            leftGrid.innerHTML = '';
            rightGrid.innerHTML = '';

            const dataMap = {};
            tableDataList.forEach(item => { if(item) dataMap[item.Table_No] = item; });

            // 📊 คำนวณสรุปยอดโต๊ะ (ทั้งหมด 150 โต๊ะ)
            const totalTables = 150;
            let bookedCount = 0;

            for (let tNum = 1; tNum <= 150; tNum++) {
                const itemData = dataMap[tNum];
                if (itemData) {
                    const customerName = (itemData.Customer_Name || itemData.Note || '').trim();
                    const status = itemData.Status || '';
                    if (customerName !== '' || (status && status !== 'Available' && status !== 'ว่าง')) {
                        bookedCount++;
                    }
                }
            }

            document.getElementById('stat-total').innerText = totalTables;
            document.getElementById('stat-booked').innerText = bookedCount;
            document.getElementById('stat-available').innerText = totalTables - bookedCount;

            for (let r = 1; r <= 10; r++) {
                // ฝั่งซ้าย
                const leftRowLabel = document.createElement('div');
                leftRowLabel.className = "flex items-center justify-center font-bold text-gray-700 text-sm md:text-base";
                leftRowLabel.innerText = r;
                leftGrid.appendChild(leftRowLabel);

                for (let c = 1; c <= 8; c++) {
                    let tNum = null;
                    if (r <= 6) {
                        tNum = (r - 1) * 15 + c;
                    } else {
                        if (c <= 7) tNum = 90 + (r - 7) * 15 + c;
                        else tNum = null;
                    }
                    createCard(leftGrid, tNum, dataMap);
                }

                // ฝั่งขวา
                const rightRowLabel = document.createElement('div');
                rightRowLabel.className = "flex items-center justify-center font-bold text-gray-700 text-sm md:text-base";
                rightRowLabel.innerText = r;
                rightGrid.appendChild(rightRowLabel);

                for (let c = 1; c <= 8; c++) {
                    let tNum = null;
                    if (r <= 6) {
                        if (c <= 7) tNum = (r - 1) * 15 + (8 + c);
                        else tNum = null;
                    } else {
                        tNum = 90 + (r - 7) * 15 + (7 + c);
                    }
                    createCard(rightGrid, tNum, dataMap);
                }
            }
        }

        async function fetchTableData() {
            if (!GAS_API_URL) return;
            try {
                const response = await fetch(GAS_API_URL);
                const json = await response.json();
                if (json.status === "success") {
                    renderGrids(json.data);
                }
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        // Tooltip & Modal Functions
        const tooltip = document.getElementById('table-tooltip');

        function showTooltip(e, table) {
            const customerName = (table.Customer_Name || table.Note || '').trim();
            const safeTableNo = escapeHtml(table.Table_No);
            
            const computedStatus = customerName !== '' ? 'จองแล้ว' : (table.Status && table.Status !== 'Available' ? table.Status : 'ว่าง');
            const safeStatus = escapeHtml(computedStatus);
            const safeCustomer = escapeHtml(customerName || '-');

            const statusColorClass = computedStatus === 'จองแล้ว' ? 'text-emerald-400 font-bold' : 'text-gray-400';

            document.getElementById('tooltip-title').innerText = `โต๊ะหมายเลข ${safeTableNo}`;
            document.getElementById('tooltip-body').innerHTML = `
                <div class="flex justify-between gap-3"><span class="text-gray-400">สถานะ:</span><span class="${statusColorClass}">${safeStatus}</span></div>
                <div class="flex justify-between gap-3"><span class="text-gray-400">ผู้จอง/หมายเหตุ:</span><span class="text-white font-medium">${safeCustomer}</span></div>
            `;
            
            tooltip.classList.remove('hidden');
            updateTooltipPosition(e);
        }

        function updateTooltipPosition(e) {
            const tooltipWidth = tooltip.offsetWidth || 180;
            const tooltipHeight = tooltip.offsetHeight || 80;
            
            let x = e.clientX + 15;
            let y = e.clientY + 15;

            if (x + tooltipWidth > window.innerWidth - 10) x = e.clientX - tooltipWidth - 10;
            if (y + tooltipHeight > window.innerHeight - 10) y = e.clientY - tooltipHeight - 10;

            tooltip.style.left = `${x}px`;
            tooltip.style.top = `${y}px`;
        }

        function hideTooltip() { tooltip.classList.add('hidden'); }

        function openModal(table) {
            hideTooltip();
            const customerName = (table.Customer_Name || table.Note || '').trim();
            const safeTableNo = escapeHtml(table.Table_No);
            const computedStatus = customerName !== '' ? 'จองแล้ว' : (table.Status && table.Status !== 'Available' ? table.Status : 'ว่าง');
            
            const safeStatus = escapeHtml(computedStatus);
            const safeCustomer = escapeHtml(customerName || '-');

            document.getElementById('modal-title').innerText = `รายละเอียด โต๊ะหมายเลข ${safeTableNo}`;
            const body = document.getElementById('modal-body');
            const statusColorClass = computedStatus === 'จองแล้ว' ? 'text-emerald-700 font-bold' : 'text-gray-500';

            body.innerHTML = `
                <div class="flex justify-between border-b pb-1.5"><span class="font-semibold">สถานะ:</span><span class="${statusColorClass}">${safeStatus}</span></div>
                <div class="flex justify-between border-b pb-1.5"><span class="font-semibold">ชื่อผู้จอง / หมายเหตุ:</span><span class="font-medium">${safeCustomer}</span></div>
            `;
            document.getElementById('table-modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('table-modal').classList.add('hidden'); }

        // เริ่มต้นการทำงาน
        renderGrids([]);
        fetchTableData();
        setInterval(fetchTableData, 5000);
    </script>
</body>
</html>
